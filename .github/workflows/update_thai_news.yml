name: Weekly Thai AI News Update

on:
  schedule:
    # Sunday 08:10 JST = Saturday 23:10 UTC
    - cron: "10 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-news.txt

      - run: pip install -r requirements-news.txt

      - name: Configure Git
        run: |
          git config user.name "thai-trainer-news-bot"
          git config user.email "actions@users.noreply.github.com"

      # Stage 1 is deliberately committed immediately. If a later AI stage fails,
      # the raw snapshot is still preserved in the repository for inspection/retry.
      - name: 1. Fetch Thai PBS raw news
        env:
          THAI_NEWS_DISCOVERY_DAYS: "3"
        run: python scripts/fetch_news.py

      - name: Commit raw news snapshot
        run: |
          git add data/news_raw.json
          if git diff --cached --quiet; then
            echo "Raw snapshot unchanged."
          else
            git commit -m "data: refresh raw Thai PBS news snapshot"
            git push
          fi

      # Ver6.4 Stage 2 reads ONLY data/news_raw.json and generates short news only.
      # Long-reading generation is frozen until Level 3+.
      - name: 2. Generate 5 Thai short-news candidates from raw snapshot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_NEWS_MODEL: gpt-5.4-mini
          THAI_NEWS_LEVEL: "2"
        run: python scripts/generate_news.py

      - name: Commit AI candidate snapshot
        run: |
          git add data/news_candidates.json
          if git diff --cached --quiet; then
            echo "Candidate snapshot unchanged."
          else
            git commit -m "data: generate Thai news learning candidates"
            git push
          fi

      # Ver6.4 Stage 3 creates learner-facing short news only.
      # news_content.json intentionally stores reading_passages as [].
      - name: 3. Build 5 Japanese short-news questions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_NEWS_MODEL: gpt-5.4-mini
          THAI_NEWS_LEVEL: "2"
        run: python scripts/build_news_content.py

      - name: Commit final learning content
        run: |
          git add news_content.json
          if git diff --cached --quiet; then
            echo "Final learning content unchanged."
          else
            git commit -m "chore: publish weekly Thai AI news learning content"
            git push
          fi
