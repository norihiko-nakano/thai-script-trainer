name: Temporary news fallback checks
on:
  push:
    branches: [fix/news-replace-rejected-articles]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-news.txt pytest
      - name: Run news fallback regression tests
        run: python -m pytest -q tests/test_pipeline.py -k "short_generator_keeps_three_verified_backup_articles or failed_source_review_uses_a_different_article or generation_stage_smoke or shorts_accept_unknown_words_after_source_review or short_spacing_survives_generation"
