<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8a4f2d" />
  <title>Thai Vocabulary Trainer Ver2.1</title>
  <style>
    :root {
      --paper: #fffdf8;
      --background: #f4eee5;
      --ink: #2d2926;
      --muted: #746b64;
      --primary: #a9572c;
      --primary-dark: #82401f;
      --secondary: #ede0d2;
      --success: #247a4b;
      --success-bg: #e8f6ed;
      --danger: #a73b35;
      --danger-bg: #fdecea;
      --border: #d8c9b8;
      --shadow: 0 14px 36px rgba(76, 50, 30, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.88), transparent 34rem),
        var(--background);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
    }

    button, input, select { font: inherit; }
    button { touch-action: manipulation; }

    .app-shell {
      width: min(760px, calc(100% - 24px));
      margin: 24px auto;
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(138, 79, 45, 0.13);
      border-radius: 24px;
      padding: clamp(20px, 4vw, 36px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
      text-align: center;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: clamp(1.55rem, 5vw, 2.2rem); }
    h2 { font-size: clamp(1.3rem, 4vw, 1.8rem); }
    .subtitle, .muted { color: var(--muted); }
    .center { text-align: center; }
    .hidden { display: none !important; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .mode-button {
      min-height: 150px;
      padding: 20px;
      border: 2px solid transparent;
      border-radius: 18px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 6px 18px rgba(76, 50, 30, 0.09);
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .mode-button:hover, .mode-button:focus-visible {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 10px 22px rgba(76, 50, 30, 0.14);
      outline: none;
    }

    .mode-icon { display: block; font-size: 2.2rem; margin-bottom: 8px; }
    .mode-title { display: block; font-weight: 800; font-size: 1.12rem; }
    .mode-description { display: block; margin-top: 6px; color: var(--muted); font-size: 0.93rem; }

    .settings {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    select {
      padding: 9px 32px 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .quiz-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      background: var(--secondary);
      border-radius: 999px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--primary);
      border-radius: inherit;
      transition: width 180ms ease;
    }

    .icon-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px;
      border-radius: 9px;
      cursor: pointer;
    }

    .icon-button:hover, .icon-button:focus-visible {
      background: var(--secondary);
      outline: none;
    }

    .prompt-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .prompt-word {
      min-height: 78px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      font-weight: 800;
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: 1.25;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .prompt-word.thai {
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      font-size: clamp(2.7rem, 11vw, 5rem);
    }

    .answer-input {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #fff;
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      font-size: 1.65rem;
      text-align: center;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(169, 87, 44, 0.13);
      outline: none;
    }

    .keyboard-panel {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fbf5ed;
    }

    .keyboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 4px 0;
    }

    .key {
      flex: 1 1 0;
      min-width: 0;
      min-height: 42px;
      padding: 4px 2px;
      border: 1px solid #cdbba8;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.28rem);
      cursor: pointer;
      box-shadow: 0 2px 0 #cdbba8;
    }

    .key:hover, .key:focus-visible { background: #fff8ee; outline: none; }
    .key:active { transform: translateY(1px); box-shadow: 0 1px 0 #cdbba8; }
    .key.wide { flex: 1.8 1 0; font-family: inherit; font-size: 0.88rem; }
    .key.active { background: var(--primary); color: white; border-color: var(--primary-dark); }
    .key:disabled { opacity: 0.5; cursor: default; transform: none; }

    .choice-grid {
      display: grid;
      gap: 10px;
    }

    .choice-button {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .choice-button:hover, .choice-button:focus-visible {
      border-color: var(--primary);
      background: #fff8ee;
      outline: none;
    }

    .choice-button.selected { border-color: var(--primary); background: #fff3e7; }
    .choice-button.correct { border-color: var(--success); background: var(--success-bg); }
    .choice-button.wrong { border-color: var(--danger); background: var(--danger-bg); }
    .choice-button:disabled { color: var(--ink); cursor: default; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .button {
      min-width: 150px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .button.primary { background: var(--primary); color: white; }
    .button.primary:hover, .button.primary:focus-visible { background: var(--primary-dark); outline: none; }
    .button.secondary { background: var(--secondary); color: var(--ink); }
    .button.secondary:hover, .button.secondary:focus-visible { background: #dfcdbb; outline: none; }
    .button:disabled { opacity: 0.5; cursor: default; }

    .feedback {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      text-align: left;
    }

    .feedback.correct { background: var(--success-bg); border: 1px solid #b8dec7; }
    .feedback.wrong { background: var(--danger-bg); border: 1px solid #efc3be; }
    .feedback-title { font-weight: 850; font-size: 1.12rem; }
    .answer-thai { font: 800 1.7rem/1.5 "Noto Sans Thai", Tahoma, sans-serif; }
    .feedback dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin-bottom: 0; }
    .feedback dt { font-weight: 750; }
    .feedback dd { margin: 0; overflow-wrap: anywhere; }

    .score-ring {
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      margin: 20px auto;
      border: 13px solid var(--secondary);
      border-radius: 50%;
      font-size: 2rem;
      font-weight: 850;
    }

    .wrong-list {
      margin-top: 22px;
      text-align: left;
    }

    .wrong-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-card {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fffaf3;
      text-align: left;
    }

    .history-card h2 {
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .history-stat {
      padding: 10px;
      border-radius: 12px;
      background: white;
      text-align: center;
    }

    .history-stat strong {
      display: block;
      font-size: 1.25rem;
    }

    .history-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .small-button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--ink);
      cursor: pointer;
    }

    .small-button:hover, .small-button:focus-visible {
      border-color: var(--primary);
      background: #fff3e7;
      outline: none;
    }

    .history-note {
      margin-bottom: 0;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .error-box {
      padding: 18px;
      border: 1px solid #efc3be;
      border-radius: 14px;
      background: var(--danger-bg);
      text-align: left;
    }

    @media (max-width: 600px) {
      .app-shell { margin: 12px auto; width: min(100% - 14px, 760px); }
      .card { border-radius: 18px; padding: 18px 12px; }
      .mode-grid { grid-template-columns: 1fr; }
      .mode-button { min-height: 118px; }
      .quiz-header { grid-template-columns: auto 1fr; }
      #progressText { grid-column: 1 / -1; text-align: center; order: 3; }
      .keyboard-panel { padding: 7px 4px; }
      .keyboard-row { gap: 2px; margin: 3px 0; }
      .key { min-height: 40px; border-radius: 6px; padding-inline: 0; }
      .feedback dl { grid-template-columns: 1fr; }
      .feedback dd { margin-bottom: 7px; }
      .history-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <div class="brand">
        <span aria-hidden="true">🇹🇭</span>
        <h1>Thai Vocabulary Trainer <small>Ver2.1</small></h1>
      </div>

      <div id="loadingScreen" class="center">
        <p class="subtitle">単語データを読み込んでいます… 🐘</p>
      </div>

      <div id="errorScreen" class="hidden">
        <div class="error-box">
          <h2>データを読み込めませんでした</h2>
          <p id="errorMessage"></p>
          <p class="muted">
            <code>index.html</code>と<code>questions.json</code>を同じフォルダへ置き、
            GitHub Pagesまたはローカルサーバーから開いてください。
          </p>
        </div>
      </div>

      <div id="menuScreen" class="hidden center">
        <p class="subtitle">本物のタイ単語を、表と裏から鍛えますぞ(｀･∀･´)</p>

        <div class="settings">
          <label for="questionCount">1回の問題数</label>
          <select id="questionCount">
            <option value="5" selected>5問</option>
            <option value="10">10問</option>
            <option value="20">20問</option>
          </select>
        </div>

        <div class="mode-grid">
          <button class="mode-button" type="button" data-mode="writing">
            <span class="mode-icon" aria-hidden="true">✍️</span>
            <span class="mode-title">タイ語を書く</span>
            <span class="mode-description">日本語を見て、画面キーボードでタイ語を入力</span>
          </button>

          <button class="mode-button" type="button" data-mode="choice">
            <span class="mode-icon" aria-hidden="true">🧠</span>
            <span class="mode-title">日本語を選ぶ</span>
            <span class="mode-description">タイ語を見て、日本語の意味を4択</span>
          </button>
        </div>

        <p id="dataSummary" class="muted"></p>

        <section class="history-card" aria-labelledby="historyHeading">
          <h2 id="historyHeading">📊 この端末の学習履歴</h2>
          <div class="history-stats">
            <div class="history-stat"><strong id="historyTotal">0</strong><span>総回答数</span></div>
            <div class="history-stat"><strong id="historyAccuracy">－</strong><span>正解率</span></div>
            <div class="history-stat"><strong id="historyToday">0</strong><span>今日の回答</span></div>
          </div>
          <p id="historyLastStudy" class="muted">まだ回答履歴はありません。</p>
          <div class="history-actions">
            <button id="exportHistoryButton" class="small-button" type="button">履歴をCSV保存</button>
            <button id="clearHistoryButton" class="small-button" type="button">履歴を消去</button>
          </div>
          <p class="history-note">履歴はこのブラウザ内だけに保存されます。別の端末やブラウザとは共有されません。</p>
        </section>
      </div>

      <div id="quizScreen" class="hidden">
        <div class="quiz-header">
          <button id="quitButton" class="icon-button" type="button" aria-label="メニューへ戻る">← 戻る</button>
          <div class="progress-track" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div id="progressText" class="muted"></div>
        </div>

        <div class="center">
          <p id="promptLabel" class="prompt-label"></p>
          <div id="promptWord" class="prompt-word"></div>
        </div>

        <div id="writingArea" class="hidden">
          <label class="hidden" for="answerInput">タイ語の回答</label>
          <input
            id="answerInput"
            class="answer-input"
            type="text"
            lang="th"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="タイ語を入力"
          />

          <div class="keyboard-panel" aria-label="画面上のタイ語キーボード">
            <div class="keyboard-toolbar">
              <span>画面キーボード</span>
              <span>物理キーボードからの入力も可能</span>
            </div>
            <div id="keyboard"></div>
          </div>
        </div>

        <div id="choiceArea" class="choice-grid hidden"></div>
        <div id="feedback" class="feedback hidden" aria-live="polite"></div>

        <div class="actions">
          <button id="submitButton" class="button primary" type="button">回答する</button>
          <button id="nextButton" class="button primary hidden" type="button">次の問題へ</button>
        </div>
      </div>

      <div id="resultScreen" class="hidden center">
        <h2>結果発表 🎉</h2>
        <div id="scoreRing" class="score-ring"></div>
        <p id="scoreMessage"></p>
        <div id="wrongList" class="wrong-list"></div>
        <div class="actions">
          <button id="retryWrongButton" class="button primary hidden" type="button">間違えた単語を復習</button>
          <button id="restartButton" class="button secondary" type="button">同じモードでもう一度</button>
          <button id="menuButton" class="button secondary" type="button">メニューへ戻る</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const NORMAL_KEYS = [
      ["ๅ", "/", "-", "ภ", "ถ", "ุ", "ึ", "ค", "ต", "จ", "ข", "ช"],
      ["ๆ", "ไ", "ำ", "พ", "ะ", "ั", "ี", "ร", "น", "ย", "บ", "ล"],
      ["ฟ", "ห", "ก", "ด", "เ", "้", "่", "า", "ส", "ว", "ง"],
      ["ผ", "ป", "แ", "อ", "ิ", "ื", "ท", "ม", "ใ", "ฝ"]
    ];

    const SHIFT_KEYS = [
      ["+", "๑", "๒", "๓", "๔", "ู", "฿", "๕", "๖", "๗", "๘", "๙"],
      ["๐", "\"", "ฎ", "ฑ", "ธ", "ํ", "๊", "ณ", "ฯ", "ญ", "ฐ", ",", "ฅ"],
      ["ฤ", "ฆ", "ฏ", "โ", "ฌ", "็", "๋", "ษ", "ศ", "ซ", "."],
      ["(", ")", "ฉ", "ฮ", "ฺ", "์", "?", "ฒ", "ฬ", "ฦ"]
    ];

    const HISTORY_STORAGE_KEY = "thaiVocabularyTrainerHistoryV1";

    const state = {
      allQuestions: [],
      quizQuestions: [],
      currentIndex: 0,
      score: 0,
      mode: "writing",
      answered: false,
      selectedChoice: null,
      wrongQuestions: [],
      shifted: false,
      lastQuizSource: null,
      meta: {},
      history: [],
      questionStartedAt: null
    };

    const elements = {};

    document.addEventListener("DOMContentLoaded", init);

    function init() {
      [
        "loadingScreen", "errorScreen", "errorMessage", "menuScreen", "quizScreen",
        "resultScreen", "questionCount", "dataSummary", "quitButton", "progressFill",
        "progressText", "promptLabel", "promptWord", "writingArea", "answerInput",
        "keyboard", "choiceArea", "feedback", "submitButton", "nextButton",
        "scoreRing", "scoreMessage", "wrongList", "retryWrongButton", "restartButton",
        "menuButton", "historyTotal", "historyAccuracy", "historyToday",
        "historyLastStudy", "exportHistoryButton", "clearHistoryButton"
      ].forEach(id => { elements[id] = document.getElementById(id); });

      document.querySelectorAll("[data-mode]").forEach(button => {
        button.addEventListener("click", () => startQuiz(button.dataset.mode));
      });

      elements.quitButton.addEventListener("click", showMenu);
      elements.submitButton.addEventListener("click", submitAnswer);
      elements.nextButton.addEventListener("click", nextQuestion);
      elements.retryWrongButton.addEventListener("click", retryWrongQuestions);
      elements.restartButton.addEventListener("click", () => startQuiz(state.mode));
      elements.menuButton.addEventListener("click", showMenu);
      elements.exportHistoryButton.addEventListener("click", exportHistoryCsv);
      elements.clearHistoryButton.addEventListener("click", clearHistory);
      elements.answerInput.addEventListener("keydown", event => {
        if (event.key === "Enter" && !state.answered) {
          event.preventDefault();
          submitAnswer();
        }
      });

      state.history = loadHistory();
      updateHistorySummary();
      renderKeyboard();
      loadQuestions();
    }

    async function loadQuestions() {
      try {
        const response = await fetch("questions.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`questions.jsonの取得に失敗しました（HTTP ${response.status}）。`);
        }

        const data = await response.json();
        const questions = Array.isArray(data) ? data : data.questions;
        state.meta = Array.isArray(data) ? {} : (data.meta || {});

        if (!Array.isArray(questions) || questions.length < 4) {
          throw new Error("4択問題を作るため、questions.jsonには4件以上の単語が必要です。");
        }

        state.allQuestions = questions.filter(isUsableQuestion);
        if (state.allQuestions.length < 4) {
          throw new Error("日本語とタイ語が入った有効な問題が4件未満です。");
        }

        elements.dataSummary.textContent = `${state.allQuestions.length}語を収録`;
        showScreen("menu");
      } catch (error) {
        console.error(error);
        elements.errorMessage.textContent = error instanceof Error ? error.message : String(error);
        showScreen("error");
      }
    }

    function isUsableQuestion(question) {
      return question &&
        typeof question.japanese === "string" && question.japanese.trim() &&
        typeof question.thai === "string" && question.thai.trim();
    }

    function showScreen(name) {
      const screens = {
        loading: elements.loadingScreen,
        error: elements.errorScreen,
        menu: elements.menuScreen,
        quiz: elements.quizScreen,
        result: elements.resultScreen
      };

      Object.entries(screens).forEach(([key, screen]) => {
        screen.classList.toggle("hidden", key !== name);
      });
    }

    function showMenu() {
      state.quizQuestions = [];
      state.wrongQuestions = [];
      updateHistorySummary();
      showScreen("menu");
    }

    function startQuiz(mode, suppliedQuestions = null) {
      state.mode = mode;
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.selectedChoice = null;
      state.wrongQuestions = [];
      state.shifted = false;

      const requestedCount = Number.parseInt(elements.questionCount.value, 10) || 5;
      const source = suppliedQuestions || uniqueByPromptPair(state.allQuestions);
      state.lastQuizSource = suppliedQuestions;
      state.quizQuestions = suppliedQuestions
        ? shuffle([...source])
        : shuffle([...source]).slice(0, Math.min(requestedCount, source.length));

      renderKeyboard();
      showScreen("quiz");
      showQuestion();
    }

    function uniqueByPromptPair(questions) {
      const seen = new Set();
      return questions.filter(question => {
        const key = `${question.japanese}\u0000${question.thai}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function showQuestion() {
      const question = currentQuestion();
      state.answered = false;
      state.selectedChoice = null;
      state.questionStartedAt = Date.now();

      const number = state.currentIndex + 1;
      const total = state.quizQuestions.length;
      elements.progressText.textContent = `問題 ${number} / ${total}`;
      elements.progressFill.style.width = `${(state.currentIndex / total) * 100}%`;
      elements.feedback.className = "feedback hidden";
      elements.feedback.replaceChildren();
      elements.nextButton.classList.add("hidden");
      elements.submitButton.classList.remove("hidden");
      elements.submitButton.disabled = false;

      if (state.mode === "writing") {
        elements.promptLabel.textContent = "この日本語をタイ語で入力してください";
        elements.promptWord.textContent = question.japanese;
        elements.promptWord.className = "prompt-word";
        elements.writingArea.classList.remove("hidden");
        elements.choiceArea.classList.add("hidden");
        elements.answerInput.value = "";
        elements.answerInput.disabled = false;
        setKeyboardDisabled(false);
        window.setTimeout(() => elements.answerInput.focus(), 0);
      } else {
        elements.promptLabel.textContent = "このタイ語の意味を選んでください";
        elements.promptWord.textContent = question.thai;
        elements.promptWord.className = "prompt-word thai";
        elements.writingArea.classList.add("hidden");
        elements.choiceArea.classList.remove("hidden");
        renderChoices(question);
      }
    }

    function currentQuestion() {
      return state.quizQuestions[state.currentIndex];
    }

    function renderChoices(question) {
      elements.choiceArea.replaceChildren();
      const correctLabel = japaneseDisplay(question);
      const distractors = uniqueStrings(
        shuffle(state.allQuestions)
          .filter(item => item.thai !== question.thai)
          .map(japaneseDisplay)
          .filter(label => label !== correctLabel)
      ).slice(0, 3);

      const choices = shuffle([correctLabel, ...distractors]);

      choices.forEach((label, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-button";
        button.dataset.value = label;
        button.textContent = `${index + 1}. ${label}`;
        button.addEventListener("click", () => selectChoice(button, label));
        elements.choiceArea.appendChild(button);
      });
    }

    function japaneseDisplay(question) {
      const alternatives = Array.isArray(question.acceptedJapanese)
        ? uniqueStrings(question.acceptedJapanese)
        : [];
      return alternatives.length ? alternatives.join(" / ") : question.japanese;
    }

    function selectChoice(button, label) {
      if (state.answered) return;
      state.selectedChoice = label;
      document.querySelectorAll(".choice-button").forEach(item => {
        item.classList.toggle("selected", item === button);
      });
    }

    function submitAnswer() {
      if (state.answered) return;

      const question = currentQuestion();
      let isCorrect = false;
      let userAnswer = "";

      if (state.mode === "writing") {
        userAnswer = elements.answerInput.value.trim();
        if (!userAnswer) {
          elements.answerInput.focus();
          showTemporaryInputNotice("タイ語を入力してください (´・ω・｀)");
          return;
        }

        const acceptedThai = Array.isArray(question.acceptedThai) && question.acceptedThai.length
          ? question.acceptedThai
          : [question.thai];

        isCorrect = acceptedThai.some(answer => normalizeThai(answer) === normalizeThai(userAnswer));
        elements.answerInput.disabled = true;
        setKeyboardDisabled(true);
      } else {
        if (!state.selectedChoice) {
          showTemporaryInputNotice("日本語を1つ選んでください (´・ω・｀)");
          return;
        }
        userAnswer = state.selectedChoice;
        isCorrect = userAnswer === japaneseDisplay(question);
        markChoiceButtons(question, userAnswer);
      }

      state.answered = true;
      elements.submitButton.classList.add("hidden");
      elements.nextButton.classList.remove("hidden");
      elements.nextButton.textContent =
        state.currentIndex === state.quizQuestions.length - 1 ? "結果を見る" : "次の問題へ";
      elements.progressFill.style.width = `${((state.currentIndex + 1) / state.quizQuestions.length) * 100}%`;

      if (isCorrect) {
        state.score += 1;
      } else {
        state.wrongQuestions.push({ question, userAnswer });
      }

      recordAnswer(question, userAnswer, isCorrect);
      renderFeedback(question, userAnswer, isCorrect);
    }

    function showTemporaryInputNotice(message) {
      elements.feedback.className = "feedback wrong";
      elements.feedback.textContent = message;
    }

    function markChoiceButtons(question, selectedLabel) {
      const correctLabel = japaneseDisplay(question);
      document.querySelectorAll(".choice-button").forEach(button => {
        button.disabled = true;
        const value = button.dataset.value;
        button.classList.remove("selected");
        if (value === correctLabel) button.classList.add("correct");
        if (value === selectedLabel && value !== correctLabel) button.classList.add("wrong");
      });
    }

    function renderFeedback(question, userAnswer, isCorrect) {
      elements.feedback.className = `feedback ${isCorrect ? "correct" : "wrong"}`;
      elements.feedback.replaceChildren();

      const title = document.createElement("div");
      title.className = "feedback-title";
      title.textContent = isCorrect ? "✅ 正解！ ดีมาก!" : "❌ 不正解。ここで覚えれば勝ちですじゃ";
      elements.feedback.appendChild(title);

      const thai = document.createElement("div");
      thai.className = "answer-thai";
      thai.textContent = question.thai;
      elements.feedback.appendChild(thai);

      const details = [];
      details.push(["意味", japaneseDisplay(question)]);
      if (question.reading) details.push(["読み", question.reading]);
      if (!isCorrect) details.push(["あなたの回答", userAnswer || "未回答"]);

      const acceptedThai = Array.isArray(question.acceptedThai)
        ? uniqueStrings(question.acceptedThai)
        : [question.thai];
      if (state.mode === "writing" && acceptedThai.length > 1) {
        details.push(["正解として認める語", acceptedThai.join(" / ")]);
      }
      if (question.mnemonic) details.push(["覚え方", question.mnemonic]);
      if (question.usageNote) details.push(["使い方メモ", question.usageNote]);
      if (question.wordOrderNote) details.push(["語順メモ", question.wordOrderNote]);

      const list = document.createElement("dl");
      details.forEach(([term, description]) => {
        const dt = document.createElement("dt");
        const dd = document.createElement("dd");
        dt.textContent = term;
        dd.textContent = description;
        list.append(dt, dd);
      });
      elements.feedback.appendChild(list);
      elements.nextButton.focus();
    }

    function nextQuestion() {
      if (!state.answered) return;
      state.currentIndex += 1;
      if (state.currentIndex >= state.quizQuestions.length) {
        showResults();
      } else {
        showQuestion();
      }
    }

    function showResults() {
      showScreen("result");
      const total = state.quizQuestions.length;
      const percent = Math.round((state.score / total) * 100);
      elements.scoreRing.textContent = `${state.score}/${total}`;
      elements.scoreMessage.textContent = scoreMessage(percent);
      elements.wrongList.replaceChildren();

      if (state.wrongQuestions.length) {
        const heading = document.createElement("h3");
        heading.textContent = "復習する単語";
        elements.wrongList.appendChild(heading);

        state.wrongQuestions.forEach(({ question, userAnswer }) => {
          const item = document.createElement("div");
          item.className = "wrong-item";
          const thai = document.createElement("strong");
          thai.className = "answer-thai";
          thai.textContent = question.thai;
          const meaning = document.createElement("div");
          meaning.textContent = `${japaneseDisplay(question)}${question.reading ? ` ／ ${question.reading}` : ""}`;
          const answer = document.createElement("div");
          answer.className = "muted";
          answer.textContent = `あなたの回答：${userAnswer || "未回答"}`;
          item.append(thai, meaning, answer);
          elements.wrongList.appendChild(item);
        });

        elements.retryWrongButton.classList.remove("hidden");
      } else {
        elements.retryWrongButton.classList.add("hidden");
      }
    }

    function scoreMessage(percent) {
      if (percent === 100) return "満点ですぞ！タイ文字部隊、完全整列(σﾟ∀ﾟ)σ🇹🇭";
      if (percent >= 80) return "かなり良いですじゃ。あと少しで🦛級です。";
      if (percent >= 60) return "土台はできています。間違えた語をもう一周しましょう。";
      return "ここから語彙が育ちますぞ。復習ボタンで再出撃です🐙";
    }

    function retryWrongQuestions() {
      const questions = uniqueByPromptPair(state.wrongQuestions.map(item => item.question));
      startQuiz(state.mode, questions);
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn("回答履歴を読み込めませんでした。", error);
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(state.history));
      } catch (error) {
        console.warn("回答履歴を保存できませんでした。", error);
      }
    }

    function recordAnswer(question, userAnswer, isCorrect) {
      const answeredAt = new Date();
      const responseTimeMs = state.questionStartedAt
        ? Math.max(0, Date.now() - state.questionStartedAt)
        : null;

      state.history.push({
        recordId: `${answeredAt.getTime()}-${Math.random().toString(36).slice(2, 8)}`,
        answeredAt: answeredAt.toISOString(),
        mode: state.mode,
        questionId: question.id ?? "",
        japanese: question.japanese,
        thai: question.thai,
        userAnswer,
        isCorrect,
        responseTimeMs
      });

      // localStorageの肥大化を防ぐため、直近10,000回答まで保持する。
      if (state.history.length > 10000) {
        state.history = state.history.slice(-10000);
      }

      saveHistory();
      updateHistorySummary();
    }

    function updateHistorySummary() {
      if (!elements.historyTotal) return;

      const history = state.history;
      const total = history.length;
      const correct = history.filter(item => item.isCorrect).length;
      const accuracy = total ? Math.round((correct / total) * 100) : null;
      const todayKey = localDateKey(new Date());
      const todayCount = history.filter(item => {
        const date = new Date(item.answeredAt);
        return !Number.isNaN(date.getTime()) && localDateKey(date) === todayKey;
      }).length;

      elements.historyTotal.textContent = String(total);
      elements.historyAccuracy.textContent = accuracy === null ? "－" : `${accuracy}%`;
      elements.historyToday.textContent = String(todayCount);
      elements.exportHistoryButton.disabled = total === 0;
      elements.clearHistoryButton.disabled = total === 0;

      if (!total) {
        elements.historyLastStudy.textContent = "まだ回答履歴はありません。";
        return;
      }

      const latest = new Date(history[history.length - 1].answeredAt);
      elements.historyLastStudy.textContent = Number.isNaN(latest.getTime())
        ? `正解 ${correct}件 / ${total}件`
        : `最終学習：${latest.toLocaleString("ja-JP")} ／ 正解 ${correct}件`;
    }

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function exportHistoryCsv() {
      if (!state.history.length) return;

      const headers = [
        "answered_at", "mode", "question_id", "japanese", "thai",
        "user_answer", "is_correct", "response_time_ms"
      ];

      const rows = state.history.map(item => [
        item.answeredAt,
        item.mode,
        item.questionId,
        item.japanese,
        item.thai,
        item.userAnswer,
        item.isCorrect ? "1" : "0",
        item.responseTimeMs ?? ""
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(csvCell).join(","))
        .join("\r\n");
      const blob = new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `thai-vocabulary-history-${localDateKey(new Date())}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function clearHistory() {
      if (!state.history.length) return;
      const approved = window.confirm("このブラウザに保存された回答履歴をすべて消去しますか？");
      if (!approved) return;
      state.history = [];
      saveHistory();
      updateHistorySummary();
    }

    function normalizeThai(text) {
      return String(text)
        .normalize("NFC")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/\s+/g, "")
        .trim();
    }

    function renderKeyboard() {
      elements.keyboard.replaceChildren();
      const rows = state.shifted ? SHIFT_KEYS : NORMAL_KEYS;

      rows.forEach(row => {
        const rowElement = document.createElement("div");
        rowElement.className = "keyboard-row";
        row.forEach(character => {
          rowElement.appendChild(createKey(character, () => insertCharacter(character)));
        });
        elements.keyboard.appendChild(rowElement);
      });

      const controlRow = document.createElement("div");
      controlRow.className = "keyboard-row";

      const shift = createKey("Shift", toggleShift, "wide");
      if (state.shifted) shift.classList.add("active");
      const space = createKey("空白", () => insertCharacter(" "), "wide");
      const backspace = createKey("⌫ 1字削除", backspaceCharacter, "wide");
      const clear = createKey("全消去", clearInput, "wide");

      controlRow.append(shift, space, backspace, clear);
      elements.keyboard.appendChild(controlRow);
    }

    function createKey(label, handler, extraClass = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `key ${extraClass}`.trim();
      button.textContent = label;
      button.addEventListener("click", handler);
      return button;
    }

    function toggleShift() {
      if (state.answered) return;
      state.shifted = !state.shifted;
      renderKeyboard();
      elements.answerInput.focus();
    }

    function insertCharacter(character) {
      if (state.answered || elements.answerInput.disabled) return;
      const input = elements.answerInput;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? start;
      input.setRangeText(character, start, end, "end");
      input.focus();
    }

    function backspaceCharacter() {
      if (state.answered || elements.answerInput.disabled) return;
      const input = elements.answerInput;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? start;

      if (start !== end) {
        input.setRangeText("", start, end, "end");
      } else if (start > 0) {
        input.setRangeText("", start - 1, start, "end");
      }
      input.focus();
    }

    function clearInput() {
      if (state.answered || elements.answerInput.disabled) return;
      elements.answerInput.value = "";
      elements.answerInput.focus();
    }

    function setKeyboardDisabled(disabled) {
      elements.keyboard.querySelectorAll("button").forEach(button => {
        button.disabled = disabled;
      });
    }

    function shuffle(values) {
      for (let index = values.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [values[index], values[randomIndex]] = [values[randomIndex], values[index]];
      }
      return values;
    }

    function uniqueStrings(values) {
      return [...new Set(values.filter(value => typeof value === "string" && value.trim()))];
    }
  </script>
