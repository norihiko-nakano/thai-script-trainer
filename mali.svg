<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="マリ">
  <defs>
    <linearGradient id="mhair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c22"/>
      <stop offset="1" stop-color="#2e1a14"/>
    </linearGradient>
    <linearGradient id="miris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d14"/>
      <stop offset="0.55" stop-color="#8a4a2a"/>
      <stop offset="1" stop-color="#e0a060"/>
    </linearGradient>
    <radialGradient id="mbg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff4f7"/>
      <stop offset="1" stop-color="#ffd9e4"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <circle cx="100" cy="100" r="98" fill="url(#mbg)"/>

  <!-- back hair, long and soft -->
  <path d="M38 92 C30 40 70 18 100 18 C130 18 170 40 162 92 L170 170 C150 182 132 178 124 168 L76 168 C68 178 50 182 30 170 Z" fill="url(#mhair)"/>

  <!-- body: white blouse, pink café apron -->
  <path d="M52 200 C54 166 74 150 100 150 C126 150 146 166 148 200 Z" fill="#ffffff"/>
  <path d="M74 200 L78 162 L122 162 L126 200 Z" fill="#ff8fab"/>
  <path d="M86 152 L100 166 L114 152" fill="none" stroke="#ff8fab" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- neck -->
  <path d="M88 132 L88 152 C94 158 106 158 112 152 L112 132 Z" fill="#f2c8a8"/>

  <!-- face -->
  <path d="M52 92 C52 60 74 44 100 44 C126 44 148 60 148 92 C148 122 128 146 100 146 C72 146 52 122 52 92 Z" fill="#ffe2cc"/>

  <!-- blush -->
  <ellipse cx="70" cy="114" rx="11" ry="6" fill="#ff9fb6" opacity="0.65"/>
  <ellipse cx="130" cy="114" rx="11" ry="6" fill="#ff9fb6" opacity="0.65"/>
  <path d="M64 112 l3 4 M69 112 l3 4 M74 112 l3 4 M124 112 l3 4 M129 112 l3 4 M134 112 l3 4" stroke="#ff7a9a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

  <!-- eyes -->
  <g>
    <ellipse cx="78" cy="96" rx="13" ry="16" fill="#ffffff"/>
    <ellipse cx="78" cy="98" rx="11" ry="14" fill="url(#miris)"/>
    <ellipse cx="78" cy="100" rx="5" ry="7" fill="#2a120c"/>
    <circle cx="73" cy="91" r="4.5" fill="#ffffff"/>
    <circle cx="83" cy="106" r="2.2" fill="#ffffff" opacity="0.9"/>
    <path d="M64 92 C66 80 88 77 93 88" fill="none" stroke="#2a1510" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M65 90 l-6 -4 M66 86 l-4 -5" stroke="#2a1510" stroke-width="2.4" stroke-linecap="round"/>

    <ellipse cx="122" cy="96" rx="13" ry="16" fill="#ffffff"/>
    <ellipse cx="122" cy="98" rx="11" ry="14" fill="url(#miris)"/>
    <ellipse cx="122" cy="100" rx="5" ry="7" fill="#2a120c"/>
    <circle cx="117" cy="91" r="4.5" fill="#ffffff"/>
    <circle cx="127" cy="106" r="2.2" fill="#ffffff" opacity="0.9"/>
    <path d="M107 88 C112 77 134 80 136 92" fill="none" stroke="#2a1510" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M135 90 l6 -4 M134 86 l4 -5" stroke="#2a1510" stroke-width="2.4" stroke-linecap="round"/>
  </g>


  <!-- nose and smile -->
  <path d="M99 112 l2 2" stroke="#e0a080" stroke-width="2" stroke-linecap="round"/>
  <path d="M92 121 C95 131 105 131 108 121 Z" fill="#e8657e"/><path d="M95 126 C98 129 102 129 105 126" fill="none" stroke="#ff9fb0" stroke-width="2" stroke-linecap="round"/>

  <!-- bangs -->
  <path d="M48 98 C42 52 72 30 100 30 C128 30 158 52 152 98
           Q148 84 140 76 Q138 86 132 92 Q130 76 120 66 Q118 78 110 84
           Q108 72 100 62 Q94 76 84 84 Q84 74 80 66 Q72 80 66 88
           Q66 80 62 74 Q54 84 48 98 Z" fill="url(#mhair)"/>
  <!-- hair shine -->
  <path d="M70 46 C80 40 90 38 98 38" fill="none" stroke="#9a6a56" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- ahoge -->
  <path d="M100 36 C96 22 108 16 112 22 C106 20 102 26 104 34" fill="#3a2119"/>

  <!-- side locks -->
  <path d="M52 90 C46 112 48 134 58 150 C60 132 60 112 60 96 Z" fill="url(#mhair)"/>
  <path d="M148 90 C154 112 152 134 142 150 C140 132 140 112 140 96 Z" fill="url(#mhair)"/>

  <!-- jasmine hair clip (มะลิ = jasmine) -->
  <g transform="translate(140 58)">
    <g fill="#ffffff" stroke="#f3d6e0" stroke-width="1.2">
      <ellipse cx="0" cy="-10" rx="6" ry="9"/>
      <ellipse cx="0" cy="-10" rx="6" ry="9" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="9" transform="rotate(144)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="9" transform="rotate(216)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="9" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#ffd34d"/>
    <path d="M10 10 C16 14 18 20 16 26" fill="none" stroke="#5aa86b" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="17" cy="18" rx="3.5" ry="6" fill="#6cc07c" transform="rotate(-25 17 18)"/>
  </g>

  <!-- sparkles -->
  <path d="M30 46 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z" fill="#ffd34d" opacity="0.9"/>
  <path d="M172 128 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z" fill="#ff8fab" opacity="0.9"/>
</svg>
